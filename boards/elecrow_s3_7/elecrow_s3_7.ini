; PlatformIO Project Configuration File for CrowPanel Advance 7.0" HMI (ESP32-S3)
; Hardware: ESP32-S3-WROOM-1-N16R8 (16MB Flash, 8MB OPI PSRAM)
;           7.0" IPS Display over SPI, GT911 capacitive touch over I2C
; TFT SPI:        MOSI=6, MISO=4, SCLK=5, CS=7 (shared with SD Card), DC=8, BL=1 (V1.0) or controlled by STC8H1K28 (V1.2+)
; Touch GT911:    I2C SDA=15, SCL=16, INT=47, addr 0x5D
; SD Card SPI:    MOSI=6, MISO=4, SCK=5, CS=3.3V (Hardwired)
; Speaker  I2S:   BCLK=5, WCLK=6, DOUT=4
; Microphone I2S: CLK=19, WS=2, DATA=20
; Note: Serial routed to UART0 (CH341 bridge) via ARDUINO_USB_CDC_ON_BOOT=0.
; Note: For V1.2+, backlight is controlled via STC8H1K28 at I2C address 0x30.

[env:elecrow_s3_7]
upload_port = \\.\COM21
board = esp32-s3-devkitc1-n16r8
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = custom_16Mb.csv
extra_scripts =
	${env.extra_scripts}
	pre:boards/elecrow_s3_7/patch_lgfx_bounce.py
build_src_filter = ${env.build_src_filter} +<../boards/elecrow_s3_7>
build_unflags =
	-DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
	${env.build_flags}
	-Iboards/elecrow_s3_7
	-Os
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DBOARD_HAS_PSRAM
	-DDISABLE_ALL_LIBRARY_WARNINGS
	-DUSE_LOVYANGFX=1
	-DLOVYAN_PANEL=Panel_RGB
	-DLOVYAN_BUS=Bus_RGB
	-DLOVYAN_RGB_BUS=1
	; Native panel resolution for sharp text and correct scan geometry.
	-DTFT_WIDTH=800
	-DTFT_HEIGHT=480
	-DTFT_OFFSET_X=0
	-DTFT_OFFSET_Y=0
	; DISPLAY_VIEWPORT_* intentionally NOT set: with it the UI is clipped to
	; a centered 720x400 region with 40px black borders top/bottom/sides.
	; Any drawing outside that clip rect (Bruce widgets that use tft.width()
	; / tft.height() directly — wifi_atks.cpp, rf_waterfall.cpp,
	; display_js.cpp, display.cpp) is silently discarded, which showed up as
	; "white squares peeking through" at the top/bottom center where those
	; widgets tried to render. Use the full panel instead.
	-DTFT_MEM_WIDTH=800
	-DTFT_MEM_HEIGHT=480
	-DTFT_HENABLE=42
	-DTFT_VSYNC=41
	-DTFT_HSYNC=40
	-DTFT_PCLK=39
	-DTFT_D0=21
	-DTFT_D1=47
	-DTFT_D2=48
	-DTFT_D3=45
	-DTFT_D4=38
	-DTFT_D5=9
	-DTFT_D6=10
	-DTFT_D7=11
	-DTFT_D8=12
	-DTFT_D9=13
	-DTFT_D10=14
	-DTFT_D11=7
	-DTFT_D12=17
	-DTFT_D13=18
	-DTFT_D14=3
	-DTFT_D15=46
	; PCLK left at 21MHz (panel's target). Lowering to 14MHz to reduce PSRAM
	; contention caused the vertical sync to drift and the whole picture to
	; jitter up and down — the SC7277 driver needs the higher rate to hold
	; a stable frame. The real fix for tearing is a bounce buffer via
	; esp_lcd_new_rgb_panel, not slower PCLK.
	-DTFT_WRITE_FREQ=21000000
	-DTFT_HSYNC_POLARITY=0
	-DTFT_HSYNC_PULSE_WIDTH=4
	-DTFT_HSYNC_BACK_PORCH=8
	-DTFT_HSYNC_FRONT_PORCH=8
	-DTFT_VSYNC_POLARITY=1
	-DTFT_VSYNC_PULSE_WIDTH=4
	-DTFT_VSYNC_BACK_PORCH=8
	-DTFT_VSYNC_FRONT_PORCH=8
	-DTFT_PCLK_IDLE_HIGH=1

	-DELECROW

	; ---- RGB tearing fix: bounce-buffer scanout via ESP-IDF -----------------
	; LovyanGFX's Bus_RGB (as shipped) uses a raw i80/GDMA hack that reads the
	; 800x480x2 framebuffer directly out of PSRAM every scan line. Any CPU-side
	; write to that framebuffer (any tft.* draw call, any menu redraw, any JS
	; script rendering) races the DMA reader, showing up as visible tearing.
	;
	; The patch_lgfx_bounce.py extra_script (see extra_scripts below) rewrites
	; Bus_RGB::init() at build time to instead use esp_lcd_new_rgb_panel with
	; a bounce buffer sized by LGFX_BOUNCE_LINES lines of the panel width
	; (~1.6 KB per line, so N=10 => 16 KB per buffer, ~32 KB total in SRAM).
	; The bounce buffer is refilled from the PSRAM framebuffer by a background
	; task and DMA scans out of the SRAM buffer only, so CPU writes to the
	; PSRAM FB are decoupled from scanout — no tearing.
	;
	; Tuning knob (LGFX_BOUNCE_LINES, default in patcher = 6):
	;   Larger  = more tearing headroom during Wi-Fi/BT DMA bursts, but eats
	;             more contiguous internal DMA-capable SRAM. BLE controller
	;             init (radioHasMemForBle in src/core/radio_mem.h) needs a
	;             >=15 KB contiguous DMA block; too-large bounce buffers
	;             fragment the DMA region and cause "Low RAM: free WiFi/SD
	;             first" errors on BLE scan.
	;   Smaller = frees SRAM for BLE at the cost of visible tearing under
	;             Wi-Fi traffic. Values below ~6 are a last-resort fallback.
	; Set to override the patcher default:
	;   -DLGFX_BOUNCE_LINES=6   ; better BLE/Wi-Fi headroom, mild tearing
	;   -DLGFX_BOUNCE_LINES=10  ; balanced default
	;   -DLGFX_BOUNCE_LINES=16  ; smoother Wi-Fi, BLE may refuse to init
	-DLGFX_BOUNCE_LINES=40
	;
	; The patcher is idempotent (checks for a marker at the top of the file)
	; and only touches libdeps for this env. Marker version bumps (V2, V3...)
	; force a re-patch on next build.
	; -----------------------------------------------------------------------

	; Speaker I2S (Note: Pins 4,5,6 overlap with SD Card and LCD. Remap if needed)
	-DBCLK=5
	-DWCLK=6
	-DDOUT=4

	; Microphone I2S
	-DPIN_CLK=19
	-DI2S_SCLK_PIN=19
	-DPIN_DATA=20
	-DI2S_DATA_PIN=20

	; No RGB LED
	-DRGB_LED=-1

	; BadUSB: GPIO 17/18 are RGB panel D12/D13 data lines — cannot be used as UART.
	; Use the dedicated serial UART pins (43/44) instead.
	-DBAD_TX=43
	-DBAD_RX=44

	; Serial/GPS
	-DSERIAL_TX=43
	-DSERIAL_RX=44
	-DGPS_SERIAL_TX=SERIAL_TX
	-DGPS_SERIAL_RX=SERIAL_RX

	; Buttons - touch only
	-DHAS_BTN=0
	-DBTN_ALIAS='"Ok"'
	-DBTN_PIN=0

	; IR/RF: GPIO 17/18 are RGB panel D12/D13 — cannot be used. Disable.
	-DIR_TX_PINS='{}'
	-DIR_RX_PINS='{}'
	-DTXLED=-1
	-DLED_ON=HIGH
	-DLED_OFF=LOW

	; RF: GPIO 17/18 are RGB panel data lines — disable RF on those pins.
	-DRF_TX_PINS='{}'
	-DRF_RX_PINS='{}'

	; Font sizes
	-DFP=1
	-DFM=2
	-DFG=3

	; Screen
	-DHAS_SCREEN=1
	-DROTATION=1
	; Use the direct backlight pin as a fallback if the STC8H1K28 controller is not responsive.
	-DBACKLIGHT=1
	-DMINBRIGHT=10

	; TFT_eSPI defines intentionally omitted:
	; The active display driver is LovyanGFX (see USE_LOVYANGFX above and
	; lib/HAL/display/tft.h). Adding TFT_eSPI's USER_SETUP_LOADED / *_DRIVER
	; here would pull in a second, unused SPI display stack — no ILI9488 or
	; SPI display exists on this board (the panel is parallel RGB via the
	; SC7277 driver IC). Keep this section empty to avoid confusing future
	; edits.
	-DSMOOTH_FONT=1

	; Touch GT911 capacitive I2C
	-DHAS_TOUCH=1
	-DHAS_CAPACITIVE_TOUCH=1
	-DTOUCH_GT911_I2C=1
	-DGT911_SLAVE_ADDRESS_L=0x5D
	-DSYS_I2C_SDA=15
	-DSYS_I2C_SCL=16
	-DGT911_TOUCH_CONFIG_INT_GPIO_NUM=-1
	-DBOARD_TOUCH_INT=-1

	; SD Card SPI (Shares SPI bus with LCD)
	-DSDCARD_CS=-1 ; Hardwired to 3.3V
	-DSDCARD_SCK=5
	-DSDCARD_MISO=4
	-DSDCARD_MOSI=6

	; SPI bus pin aliases (required by utils.cpp)
	-DSPI_SCK_PIN=5
	-DSPI_MOSI_PIN=6
	-DSPI_MISO_PIN=4
	-DSPI_SS_PIN=7

	; Backlight PWM (For V1.0 only)
	-DTFT_BRIGHT_CHANNEL=0
	-DTFT_BRIGHT_Bits=8
	-DTFT_BRIGHT_FREQ=5000

	-DDEVICE_NAME='"Elecrow Advance 7.0 S3"'

lib_deps =
	${env.lib_deps}
	lovyan03/LovyanGFX@1.2.19
	lewisxhe/SensorLib @ 0.3.4
