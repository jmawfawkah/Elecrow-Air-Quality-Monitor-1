; PlatformIO Project Configuration File
; Dual-MCU Architecture:
;   [env:elecrow_s3_7]  → Display, UI, Touch, Sensors, SD Card
;   [env:xiao_s3]       → WiFi, NTP, Weather API, Cloud Logging

[platformio]
default_envs = elecrow_s3_7

; ===== Shared settings =====
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ===== Elecrow Advance 7.0 (Display MCU) =====
[env:elecrow_s3_7]
upload_port = \\.\COM20
board = esp32-s3-devkitc1-n16r8
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = custom_16Mb.csv
extra_scripts =
	pre:boards/elecrow_s3_7/patch_lgfx_bounce.py
build_src_filter = +<*> -<.git/> -<src_stamp/> -<i2c_test.cpp>
build_unflags =
	-DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
; Tell LVGL where to find lv_conf.h
	-DLV_CONF_INCLUDE_SIMPLE
	-Iinclude
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DBOARD_HAS_PSRAM
	-DDISABLE_ALL_LIBRARY_WARNINGS
	-DUSE_LOVYANGFX=1
	-DLOVYAN_PANEL=Panel_RGB
	-DLOVYAN_BUS=Bus_RGB
	-DLOVYAN_RGB_BUS=1
	-DTFT_WIDTH=800
	-DTFT_HEIGHT=480
	-DTFT_OFFSET_X=0
	-DTFT_OFFSET_Y=0
	-DTFT_MEM_WIDTH=800
	-DTFT_MEM_HEIGHT=480
	-DTFT_HENABLE=42
	-DTFT_VSYNC=41
	-DTFT_HSYNC=40
	-DTFT_PCLK=39
	-DTFT_D0=21
	-DTFT_D1=47
	-DTFT_D2=48
	-DTFT_D3=45
	-DTFT_D4=38
	-DTFT_D5=9
	-DTFT_D6=10
	-DTFT_D7=11
	-DTFT_D8=12
	-DTFT_D9=13
	-DTFT_D10=14
	-DTFT_D11=7
	-DTFT_D12=17
	-DTFT_D13=18
	-DTFT_D14=3
	-DTFT_D15=46
	-DTFT_WRITE_FREQ=21000000
	-DTFT_HSYNC_POLARITY=0
	-DTFT_HSYNC_PULSE_WIDTH=4
	-DTFT_HSYNC_BACK_PORCH=8
	-DTFT_HSYNC_FRONT_PORCH=8
	-DTFT_VSYNC_POLARITY=0
	-DTFT_VSYNC_PULSE_WIDTH=4
	-DTFT_VSYNC_BACK_PORCH=8
	-DTFT_VSYNC_FRONT_PORCH=8
	-DTFT_PCLK_IDLE_HIGH=1
	-DELECROW
	;6-20-30 settings for tearing free display updates
	-DLGFX_BOUNCE_LINES=30
	-DBCLK=5
	-DWCLK=6
	-DDOUT=4
	-DPIN_CLK=19
	-DI2S_SCLK_PIN=19
	-DPIN_DATA=20
	-DI2S_DATA_PIN=20
	-DRGB_LED=-1
	-DBAD_TX=43
	-DBAD_RX=44
	-DSERIAL_TX=43
	-DSERIAL_RX=44
	-DGPS_SERIAL_TX=SERIAL_TX
	-DGPS_SERIAL_RX=SERIAL_RX
	-DHAS_BTN=0
	-DBTN_ALIAS='"Ok"'
	-DBTN_PIN=0
	-DIR_TX_PINS='{}'
	-DIR_RX_PINS='{}'
	-DTXLED=-1
	-DLED_ON=HIGH
	-DLED_OFF=LOW
	-DRF_TX_PINS='{}'
	-DRF_RX_PINS='{}'
	-DFP=1
	-DFM=2
	-DFG=3
	-DHAS_SCREEN=1
	-DROTATION=1
	-DBACKLIGHT=1
	-DMINBRIGHT=10
	-DSMOOTH_FONT=1
	-DHAS_TOUCH=1
	-DHAS_CAPACITIVE_TOUCH=1
	-DTOUCH_GT911_I2C=1
	-DGT911_SLAVE_ADDRESS_L=0x5D
	-DSYS_I2C_SDA=15
	-DSYS_I2C_SCL=16
	-DGT911_TOUCH_CONFIG_INT_GPIO_NUM=-1
	-DBOARD_TOUCH_INT=-1
	-DSDCARD_CS=-1
	-DSDCARD_SCK=5
	-DSDCARD_MISO=4
	-DSDCARD_MOSI=6
	-DSPI_SCK_PIN=5
	-DSPI_MOSI_PIN=6
	-DSPI_MISO_PIN=4
	-DSPI_SS_PIN=7
	-DTFT_BRIGHT_CHANNEL=0
	-DTFT_BRIGHT_Bits=8
	-DTFT_BRIGHT_FREQ=5000
	-DDEVICE_NAME='"Elecrow Advance 7.0 S3"'
	-DSTAMP_UART_RX=19
	-DSTAMP_UART_TX=20
lib_deps =
	lovyan03/LovyanGFX@1.2.26
	lewisxhe/SensorLib@0.3.4
	lvgl/lvgl@9.1.0
	https://github.com/adafruit/Adafruit_AHTX0.git
	https://github.com/adafruit/Adafruit_SGP30.git
	https://github.com/adafruit/Adafruit_BusIO.git
	https://github.com/sparkfun/SparkFun_SGP40_Arduino_Library.git
	https://github.com/DFRobot/DFRobot_MICS.git

lib_ldf_mode = deep+

; ===== Seeed XIAO ESP32-S3 (Network MCU) =====
[env:xiao_s3]
upload_port = COM17
board = seeed_xiao_esp32s3
board_build.partitions = default.csv
build_src_filter = +<../src_stamp/>
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM
	-DDISABLE_ALL_LIBRARY_WARNINGS
	-DELECROW_UART_RX=44
	-DELECROW_UART_TX=43
lib_deps =
	https://github.com/bblanchon/ArduinoJson.git